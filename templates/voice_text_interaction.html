{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice & Text Interaction | NyayaSetu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body class="tool-page">
    <header class="tool-shell-header">
      <div class="tool-shell-header__inner">
        <a href="{% url 'index' %}" class="tool-shell-header__brand">
          <img src="{% static 'images/logo.png' %}" alt="NyayaSetu" />
          <span>NyayaSetu</span>
        </a>
        <span class="tool-shell-header__badge">Voice & Text</span>
      </div>
    </header>

    <main class="tool-main">
      <div class="tool-hero-card" style="margin-bottom: var(--space-6);">
        <div class="tool-hero-card__icon">🎙️</div>
        <h1>Voice & <span>Text</span> Interaction</h1>
        <p>Ask legal questions by typing or speaking — get instant guidance.</p>
      </div>

      <div class="interaction-card">
        <form method="POST">
          {% csrf_token %}
          <textarea
            name="user_input"
            placeholder="Type your question or statement..."
          ></textarea>
          <div class="btn-group">
            <button type="submit" class="btn-primary">Submit Text</button>
            <button type="button" class="btn-primary mic-btn">🎤 Speak</button>
          </div>
        </form>

        {% if response %}
        <div class="output-box">
          <h3>🧩 Response:</h3>
          <p>{{ response }}</p>
        </div>
        {% endif %}
      </div>
    </main>
  </body>
</html>
