{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyayaSetu | Legal Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>

<div class="translator-app app-container">

    <aside class="translator-sidebar sidebar">
        <div class="translator-sidebar__logo">NS</div>

        <button class="nav-btn active" onclick="switchMode('text', this)" title="Text Translation">
            <i class="fas fa-keyboard"></i>
        </button>

        <button class="nav-btn" onclick="switchMode('speech', this)" title="Speech to Text">
            <i class="fas fa-microphone"></i>
        </button>

        <button class="nav-btn" onclick="switchMode('tts', this)" title="Text to Speech">
            <i class="fas fa-volume-up"></i>
        </button>

        <button class="nav-btn" onclick="switchMode('s2s', this)" title="Speech to Speech">
            <i class="fas fa-headset"></i>
        </button>
    </aside>

    <div class="translator-panel">
        <div class="center-panel">
            <h2 class="page-title">NyayaSetu</h2>
            <div class="mode-label" id="current-mode-label">Text Translation</div>

            <div id="mode-text" class="mode-section active">
                <form id="form-text">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">From</label>
                            <select class="form-select" name="source">
                                {% for k, v in languages.items %}<option value="{{ k }}">{{ v.name }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">To</label>
                            <select class="form-select" name="target">
                                {% for k, v in languages.items %}<option value="{{ k }}" {% if k == '2' %}selected{% endif %}>{{ v.name }}</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                    <textarea class="form-control mb-3" name="text" rows="8" placeholder="Type legal text..."></textarea>
                    <button type="submit" class="btn-action">Translate Text</button>
                </form>
            </div>

            <div id="mode-speech" class="mode-section">
                <form id="form-speech">
                    {% csrf_token %}
                    <div class="audio-upload-box mb-4">
                        <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-3" style="color: var(--color-text-muted);"></i><br>
                        <input type="file" name="audio" class="form-control" accept="audio/*" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">Audio Language</label>
                            <select class="form-select" name="source">
                                {% for k, v in languages.items %}<option value="{{ k }}">{{ v.name }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Target Language</label>
                            <select class="form-select" name="target">
                                {% for k, v in languages.items %}<option value="{{ k }}">{{ v.name }}</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-action" id="speech-btn">Transcribe Audio</button>
                </form>
            </div>

            <div id="mode-tts" class="mode-section">
                <form id="form-tts">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Output Language</label>
                        <select class="form-select" name="target">
                            {% for k, v in languages.items %}<option value="{{ k }}">{{ v.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <textarea class="form-control mb-3" name="text" rows="6" placeholder="Enter text to speak..."></textarea>
                    <button type="submit" class="btn-action">Generate Speech</button>
                </form>
            </div>
        </div>

        <div class="right-panel">
            <div class="output-card">
                <div class="output-header">
                    <span><i class="fas fa-poll-h"></i> Output</span>
                    <span id="status-indicator">Ready</span>
                </div>

                <div id="output-box" class="output-content">
                    <span class="output-placeholder">Results will appear here...</span>
                </div>

                <div id="audio-container" class="mt-4 pt-3 border-top d-none">
                    <label class="small text-muted mb-2" style="display:block; margin-bottom: var(--space-2);">Generated Audio:</label>
                    <audio id="audio-player" controls class="w-100"></audio>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentMode = 'text'; // Tracks: 'text', 'speech', 'tts', 's2s'

    // 1. SWITCH MODES
    function switchMode(mode, btn) {
        currentMode = mode;

        // Reset UI
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.mode-section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');

        // Show correct form
        // Note: 's2s' uses the 'speech' form layout
        if (mode === 's2s') {
            document.getElementById('mode-speech').classList.add('active');
            document.getElementById('speech-btn').innerText = "Start Speech-to-Speech";
            document.getElementById('current-mode-label').innerText = "Speech to Speech Mode";
        } else {
            document.getElementById('mode-' + mode).classList.add('active');

            // Reset button text if coming back from s2s
            if(mode === 'speech') document.getElementById('speech-btn').innerText = "Transcribe Audio";

            const titles = {'text': 'Text Translation', 'speech': 'Speech to Text', 'tts': 'Text to Speech'};
            document.getElementById('current-mode-label').innerText = titles[mode];
        }

        // Clear output
        document.getElementById('output-box').innerText = '';
        document.getElementById('audio-container').classList.add('d-none');
        document.getElementById('audio-player').pause();
    }

    // 2. HELPER: POST DATA
    async function postData(url, formData) {
        document.getElementById('status-indicator').innerText = "Processing...";
        try {
            const res = await fetch(url, { method: 'POST', body: formData });
            return await res.json();
        } catch (e) {
            return { status: 'error', message: 'Server Connection Failed' };
        } finally {
            document.getElementById('status-indicator').innerText = "Done";
        }
    }

    // --- FORM HANDLERS ---

    // A. Text to Text
    document.getElementById('form-text').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = await postData("{% url 'translator:translate_text' %}", new FormData(e.target));
        document.getElementById('output-box').innerText = data.translation || data.message;
    });

    // B. Speech Form (Handles BOTH Speech-to-Text AND Speech-to-Speech)
    document.getElementById('form-speech').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        // Step 1: Transcribe (+ Translate text)
        document.getElementById('output-box').innerText = "Transcribing audio...";
        const data = await postData("{% url 'translator:transcribe_audio' %}", formData);

        if (data.status !== 'success') {
            document.getElementById('output-box').innerText = "Error: " + data.message;
            return;
        }

        // Show Text Result
        const resultText = data.translation || data.transcription;
        document.getElementById('output-box').innerText = resultText;

        // Step 2: IF MODE IS SPEECH-TO-SPEECH -> Generate Audio
        if (currentMode === 's2s') {
            document.getElementById('output-box').innerText += "\n\n(Generating Speech Output...)";

            // Create data for TTS
            const ttsData = new FormData();
            ttsData.append('text', resultText);
            ttsData.append('target', formData.get('target')); // Use target language from form
            ttsData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);

            // Call TTS
            const audioRes = await fetch("{% url 'translator:synthesize_speech' %}", { method: 'POST', body: ttsData });
            const audioData = await audioRes.json();

            if (audioData.status === 'success') {
                const player = document.getElementById('audio-player');
                player.src = audioData.audio_url;
                document.getElementById('audio-container').classList.remove('d-none');
                player.play();
                document.getElementById('output-box').innerText = resultText + "\n\n✅ Audio Playing...";
            } else {
                document.getElementById('output-box').innerText += "\n❌ Audio Generation Failed";
            }
        }
    });

    // C. Text to Speech
    document.getElementById('form-tts').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = await postData("{% url 'translator:synthesize_speech' %}", new FormData(e.target));

        if (data.status === 'success') {
            const player = document.getElementById('audio-player');
            player.src = data.audio_url;
            document.getElementById('audio-container').classList.remove('d-none');
            player.play();
            document.getElementById('output-box').innerText = "Speaking: \n" + e.target.text.value;
        } else {
            document.getElementById('output-box').innerText = data.message;
        }
    });
</script>

</body>
</html>
